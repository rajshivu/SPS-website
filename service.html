<body>

<header>
  <div class="logo-container">
    <img src="sps1.png" alt="Sanjeevani Power Solutions Logo" class="logo" onerror="this.style.display='none'">
    <h1>SANJEEVANI <span>POWER</span> SOLUTIONS</h1>
  </div>
  <div class="menu-toggle" id="menuToggle">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>

    <ul id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#services">Services</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="pd-hero">
  <div class="wrap">
    <span class="tag" id="pd-tag"></span>
    <h2 id="pd-name"></h2>
    <p id="pd-desc"></p>
  </div>
</section>

<section class="pd-body">
  <div class="wrap">
    <div>
      <h3>What's included</h3>
      <ul id="pd-features"></ul>
    </div>
    <div>
      <h3>Typical outcomes</h3>
      <ul id="pd-outcomes"></ul>
    </div>
  </div>
</section>

<section class="pd-gallery">
  <div class="wrap">
    <h3 style="color:#0A1C2E;margin-bottom:20px;">Gallery</h3>
    <div class="gallery-grid" id="pd-gallery"></div>
  </div>
</section>

<section class="pd-cta">
  <div class="wrap">
    <h3>Ready to scope this for your site?</h3>
    <a href="index.html#contact" class="btn btn-amber">Get a Consultation</a>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap footer-bottom" style="border-top:0;margin:0;padding-top:0;">
    <span>© 2025 Sanjeevani Power Solutions | All Rights Reserved</span>
    <a href="index.html">Back to Home</a>
  </div>
</footer>

<script>
  // Mobile menu toggle
  var menuToggle = document.getElementById('menuToggle');
  var navLinks = document.getElementById('navLinks');
  menuToggle.addEventListener('click', function () { navLinks.classList.toggle('active'); });

  // ---- Service data: edit text and image paths here ----
  var services = {
    design: {
      tag: "Electrical System Design & Engineering",
      name: "Electrical System Design & Engineering",
      desc: "Full electrical design for industrial and commercial facilities — load calculations, single-line diagrams, panel and switchgear specification, and site engineering, delivered to code and built for the working life of the plant.",
      features: [
        "Load calculation & demand analysis",
        "Single-line & schematic diagrams",
        "Panel, switchgear & cable sizing",
        "Earthing, lightning & protection design",
        "Statutory compliance & code review",
        "Site supervision during installation"
      ],
      outcomes: [
        "A system sized correctly the first time — no costly rework",
        "Documentation ready for statutory approval",
        "Lower failure risk through proper protection design",
        "A design your maintenance team can actually work from"
      ],
      gallery: ["images/design/g1.jpg", "images/design/g2.jpg", "images/design/g3.jpg", "images/design/g4.jpg", "images/design/g5.jpg", "images/design/g6.jpg"]
    },
    consultancy: {
      tag: "Power & Energy Consultancy",
      name: "Power & Energy Consultancy",
      desc: "Energy audits, load studies and power optimization that show exactly where a facility is losing efficiency — with a prioritized, measurable plan to close the gap.",
      features: [
        "Energy audits & power quality studies",
        "Load flow & demand-side analysis",
        "Tariff & power factor optimization",
        "Root-cause analysis for recurring faults",
        "Capacity planning for expansion",
        "Ongoing performance monitoring"
      ],
      outcomes: [
        "A clear, ranked list of efficiency opportunities",
        "Reduced energy cost per unit of output",
        "Fewer unplanned outages and penalty charges",
        "A monitoring baseline to track improvement over time"
      ],
      gallery: ["images/consultancy/g1.jpg", "images/consultancy/g2.jpg", "images/consultancy/g3.jpg", "images/consultancy/g4.jpg"]
    },
    sustainability: {
      tag: "Automation & Sustainability Solutions",
      name: "Automation & Sustainability Solutions",
      desc: "Automation systems and renewable integration that reduce manual dependency, cut waste and bring a facility's energy footprint in line with where regulation and cost are headed.",
      features: [
        "PLC / SCADA automation integration",
        "Solar & renewable energy integration",
        "Energy-efficiency retrofits",
        "Remote monitoring & alerting systems",
        "Sustainability & ESG reporting support",
        "Automation-ready electrical design"
      ],
      outcomes: [
        "Lower operating cost through automation and renewables",
        "Reduced carbon footprint with a documented trail",
        "Fewer manual interventions and human error",
        "A system that scales as the facility grows"
      ],
      gallery: ["images/sustainability/g1.jpg", "images/sustainability/g2.jpg", "images/sustainability/g3.jpg"]
    }
  };

  var params = new URLSearchParams(window.location.search);
  var key = params.get("service") || "design";
  var svc = services[key] || services.design;

  document.getElementById("pd-tag").textContent = svc.tag;
  document.getElementById("pd-name").textContent = svc.name;
  document.getElementById("pd-desc").textContent = svc.desc;
  document.title = svc.name + " | Sanjeevani Power Solutions";

  var featuresEl = document.getElementById("pd-features");
  svc.features.forEach(function (f) {
    var li = document.createElement("li");
    li.textContent = f;
    featuresEl.appendChild(li);
  });

  var outcomesEl = document.getElementById("pd-outcomes");
  svc.outcomes.forEach(function (o) {
    var li = document.createElement("li");
    li.textContent = o;
    outcomesEl.appendChild(li);
  });

  var galleryEl = document.getElementById("pd-gallery");
  svc.gallery.forEach(function (src) {
    var el;
    if (src.endsWith(".mp4")) {
      el = document.createElement("video");
      el.src = src; el.controls = true;
    } else {
      el = document.createElement("img");
      el.src = src; el.alt = svc.name;
      el.onerror = function () { this.classList.add("img-fallback"); };
    }
    el.classList.add("img-ph");
    galleryEl.appendChild(el);
  });
</script>
